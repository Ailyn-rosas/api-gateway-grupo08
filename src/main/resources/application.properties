
# Nombre del proyecto
spring.application.name=api-gateway-grupo08

# Puerto del API Gateway
server.port=8070

# Conexion con Eureka Server
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Ruta del microservicio de citas
spring.cloud.gateway.server.webflux.routes[0].id=cita-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://CITA-SERVICE-GRUPO08
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/citas/**

# Ruta del microservicio de pacientes
spring.cloud.gateway.server.webflux.routes[1].id=paciente-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://PACIENTE-SERVICE-GRUPO08
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/pacientes/**
